<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gift Edafe | Chief Executive Officer | Civil Engineer | Surveyor | QA/QC Professional</title>
  <meta name="description" content="Official professional profile of Gift Edafe, Chief Executive Officer at Jiro-BEACONS Engineering Nigeria Limited. Engineering leadership, integrated project delivery, QA/QC, and digital engineering intelligence.">
  <meta name="theme-color" content="#F4ECE1">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F4ECE1;
      --card-bg: #FFFFFF;
      --text-main: #000000;
      --text-muted: #555555;
      --accent-blue: #0055FF;
      --border: #E5D9CB;
      --container: 540px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      color: var(--text-main);
      background: var(--bg);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 30px 16px;
    }

    img { display: block; max-width: 100%; width: 100%; }
    a { color: inherit; text-decoration: none; }

    .card-container {
      width: min(var(--container), 100%);
      background: var(--card-bg);
      border-radius: 16px;
      padding: 35px 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
      text-align: center;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      font-weight: 800;
      font-size: 15px;
      color: #000000;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-bar-left span {
      display: inline-block;
      width: 12px;
      height: 12px;
      background: var(--accent-blue);
      border-radius: 2px;
    }

    .menu-icon {
      width: 26px;
      height: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .menu-icon span {
      display: block;
      height: 3px;
      background: var(--accent-blue);
      border-radius: 2px;
    }

    .avatar-wrapper {
      width: 130px;
      height: 130px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #FFFFFF;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #000000;
      margin-bottom: 6px;
    }

    .role-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    .location-tag {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    .blue-divider {
      width: 70px;
      height: 3px;
      background: var(--accent-blue);
      margin: 0 auto 28px;
      border-radius: 2px;
    }

    .action-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 32px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-solid {
      background: var(--accent-blue);
      color: #FFFFFF;
      border: 1px solid var(--accent-blue);
    }

    .btn-solid:hover {
      background: #0044CC;
    }

    .btn-outline {
      background: transparent;
      color: #000000;
      border: 1px solid #000000;
    }

    .btn-outline:hover {
      background: rgba(0,0,0,0.04);
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 22px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
    }

    .social-icons a {
      font-size: 16px;
      font-weight: 700;
      color: #000000;
      transition: color 0.2s ease;
    }

    .social-icons a:hover {
      color: var(--accent-blue);
    }

    .tagline-footer {
      margin-top: 24px;
      font-size: 12.5px;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>

<body>

  <div class="card-container">
    <div class="top-bar">
      <div class="top-bar-left">
        <span></span> Gift Edafe
      </div>
      <div class="menu-icon" onclick="window.location.href='resume.html'" title="Open Menu">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="avatar-wrapper">
      <img src="images/pr.jpg" alt="Gift Edafe - Chief Executive Officer" onerror="this.src='images/career-image-1.jpg';">
    </div>

    <h1>Gift Edafe</h1>
    <div class="role-title">Chief Executive Officer | Civil Engineer | Surveyor | QA/QC Professional</div>
    <div class="location-tag">Lagos &amp; Abuja, Nigeria | Global Engagement</div>
    
    <div class="blue-divider"></div>

    <div class="action-buttons">
      <a class="btn btn-solid" href="resume.html">RESUME</a>
      <a class="btn btn-outline" href="projects.html">PROJECTS</a>
    </div>

    <p class="tagline-footer">Engineering better information for smarter infrastructure &amp; businesses.</p>

    <div class="social-icons">
      <a href="https://jirobeacons.com" target="_blank" rel="noopener" title="Company Website">JB</a>
      <a href="https://linkedin.com/in/gift-edafe-135235135" target="_blank" rel="noopener" title="LinkedIn Profile">in</a>
      <a href="mailto:giftedafe@jirobeacons.com" title="Professional Email">@</a>
    </div>
  </div>

</body>
</html>
