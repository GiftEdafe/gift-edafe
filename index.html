<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gift Edafe | Chief Executive Officer | Civil Engineer | Surveyor | QA/QC Professional</title>
  <meta name="description" content="Official professional profile of Gift Edafe, Chief Executive Officer at Jiro-BEACONS Engineering Nigeria Limited. Engineering leadership, integrated project delivery, QA/QC, and digital engineering intelligence.">
  <meta name="theme-color" content="#0B0E14">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0B0E14;
      --surface: #131822;
      --surface-card: #1A2130;
      --border: rgba(37, 99, 235, 0.25);
      --border-light: rgba(255, 255, 255, 0.08);
      --text: #E2E8F0;
      --muted: #94A3B8;
      --accent-blue: #2563EB;
      --accent-blue-hover: #1D4ED8;
      --gold: #D4AF37;
      --wine: #2B0714;
      --container: 720px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 10%, rgba(37, 99, 235, 0.08) 0%, transparent 60%), var(--bg);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
      padding: 40px 20px;
    }

    img { display: block; max-width: 100%; width: 100%; }
    a { color: inherit; text-decoration: none; }

    .card-container {
      width: min(var(--container), 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 45px 35px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
      font-family: "Manrope", sans-serif;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.2px;
      color: #FFFFFF;
    }

    .top-bar span {
      color: var(--accent-blue);
    }

    .menu-icon {
      width: 32px;
      height: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }

    .menu-icon span {
      display: block;
      height: 3px;
      background: var(--accent-blue);
      border-radius: 2px;
    }

    .avatar-wrapper {
      width: 140px;
      height: 140px;
      margin: 0 auto 24px;
      border-radius: 50%;
      padding: 4px;
      background: linear-gradient(135deg, var(--accent-blue), var(--gold));
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
    }

    .role-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .location-tag {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .blue-divider {
      width: 60px;
      height: 3px;
      background: var(--accent-blue);
      margin: 0 auto 30px;
      border-radius: 2px;
    }

    .action-buttons {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 0 24px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .btn-solid {
      background: var(--accent-blue);
      color: #FFFFFF;
      border: 1px solid var(--accent-blue);
    }

    .btn-solid:hover {
      background: var(--accent-blue-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }

    .btn-outline {
      background: transparent;
      color: #FFFFFF;
      border: 1px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent-blue);
      background: rgba(37, 99, 235, 0.08);
      transform: translateY(-2px);
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding-top: 25px;
      border-top: 1px solid var(--border-light);
    }

    .social-icons a {
      width: 42px;
      height: 42px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .social-icons a:hover {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    .tagline-footer {
      margin-top: 30px;
      font-size: 13.5px;
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>

<body>

  <div class="card-container">
    <div class="top-bar">
      <div>GIFT EDAFE <span>/ PROFILE</span></div>
      <div class="menu-icon" onclick="window.location.href='resume.html'" title="Open Menu">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <div class="avatar-wrapper">
      <img src="images/pr.jpg" alt="Gift Edafe - Chief Executive Officer" onerror="this.src='images/career-image-1.jpg';">
    </div>

    <h1>GIFT EDAFE</h1>
    <div class="role-title">Chief Executive Officer | Civil Engineer | Surveyor | QA/QC Professional</div>
    <div class="location-tag">Lagos &amp; Abuja, Nigeria | Global Engagement</div>
    
    <div class="blue-divider"></div>

    <div class="action-buttons">
      <a class="btn btn-solid" href="resume.html">RESUME</a>
      <a class="btn btn-outline" href="resume.html#about">ABOUT</a>
      <a class="btn btn-outline" href="projects.html">PROJECTS</a>
      <a class="btn btn-outline" href="resume.html#credentials">CREDENTIALS</a>
    </div>

    <p class="tagline-footer">Engineering better information for smarter infrastructure &amp; businesses.</p>

    <div class="social-icons">
      <a href="https://jirobeacons.com" target="_blank" rel="noopener" title="Company Website">JB</a>
      <a href="https://linkedin.com/in/gift-edafe-135235135" target="_blank" rel="noopener" title="LinkedIn Profile">in</a>
      <a href="mailto:giftedafe@jirobeacons.com" title="Professional Email">@</a>
    </div>
  </div>

</body>
</html>
